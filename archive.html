<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="theme.js"></script>
<title>Archived quizzes | Quiz Hub</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><script src="splash.js"></script></head><body>
<nav class="bar"><div class="wrap barin"><a href="index.html" class="back">&#8962; Quiz Hub</a><span id="crumb">Archived</span></div></nav>
<header class="hero hub"><div class="wrap"><p class="tag">Archive</p><h1>Archived<br>quizzes</h1>
<p class="lead">Finished quizzes are filed in folders. Open one to retake it, grab its reviewer, or see its leaderboard.</p></div></header>
<main class="wrap"><div id="subjects" class="folders"></div></main>
<footer class="wrap foot">Scores and reviewers here belong to each archived quiz. Retake as many times as you want.</footer>
<script src="config.js"></script><script src="data.js"></script>
<script>
const el=document.getElementById('subjects');
const rd=q=>q.round||1,plural=(n,w)=>n+' '+w+(n===1?'':'s');
const msg=(h,p)=>`<div class="empty" style="grid-column:1/-1"><h2>${h}</h2><p>${p}</p></div>`;
function draw(arch){
 const A=new Set(arch||[]),groups=[];
 SUBJECTS.forEach(s=>{const mine=QUIZZES.filter(q=>q.subject===s.id&&A.has(q.id));
  [...new Set(mine.map(rd))].sort((a,b)=>a-b).forEach(r=>groups.push({s,r,qs:mine.filter(q=>rd(q)===r)}))});
 if(!groups.length){el.innerHTML=msg('Nothing archived yet','When a quiz is finished it gets filed here. <a class="hl" href="index.html">&larr; Back to Quiz Hub</a>');return}
 el.innerHTML=groups.map(({s,r,qs})=>{const n=qs.reduce((t,q)=>t+countQ(q),0);
  return `<a class="fd ${s.id}" href="subject.html?s=${s.id}&a=1&r=${r}"><i class="tab"></i><i class="paper"></i><div class="fb2"><span class="badge">${s.badge}</span><div><h2>${esc(s.name)} Quiz ${r}</h2><p>${esc(s.full)}</p></div><div class="meta"><small>${plural(qs.length,'lesson')} &middot; ${n} items</small><span class="open">Open &rarr;</span></div></div></a>`}).join('')}
{const c=archive.cached();
 if(c)draw(c);else el.innerHTML='<p class="hint">Loading archived quizzes...</p>';
 archive.ids().then(a=>{
  if(a===null){if(!c)el.innerHTML=msg('Could not load','Check your internet and try again.');return}
  if(!c||[...a].sort().join()!==[...c].sort().join())draw(a)})}
</script>
</body></html>
