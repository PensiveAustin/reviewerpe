<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz Hub</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head><body>
<header class="hero hub"><div class="wrap"><p class="tag">Quiz Hub</p><h1>Hello,<br>BSIT 1-2!</h1>
<p class="lead">Review na tayo! Pick your subject to start.</p></div></header>
<main class="wrap"><div id="subjects" class="subjects"></div></main>
<footer class="wrap foot">Your score is saved to the leaderboard when you submit. Retake as many times as you want.</footer>
<script src="config.js"></script><script src="data.js"></script>
<script>
document.getElementById('subjects').innerHTML=SUBJECTS.map(s=>{
const qs=QUIZZES.filter(q=>q.subject===s.id),n=qs.reduce((t,q)=>t+countQ(q),0);
return `<a class="sj ${s.id}" href="subject.html?s=${s.id}"><span class="badge">${s.badge}</span><div><h2>${esc(s.name)} Quiz</h2><p>${esc(s.full)}</p></div><div class="meta"><small>${qs.length?qs.length+' quizzes &middot; '+n+' items':'Coming soon'}</small><span class="open">Open &rarr;</span></div></a>`}).join('');
</script>

<script>
(function(){
var busy=false;
function go(a){
 if(busy)return;busy=true;
 var cs=getComputedStyle(a),r=a.getBoundingClientRect(),h=a.querySelector('h2'),vw=innerWidth,vh=innerHeight;
 var ov=document.createElement('div');ov.className='splash';
 ov.style.cssText='background:'+cs.backgroundColor+';color:'+cs.color+';--t:'+r.top+'px;--l:'+r.left+'px;--r2:'+(vw-r.right)+'px;--b:'+(vh-r.bottom)+'px;--r:'+cs.borderRadius;
 var g=a.cloneNode(true);g.className=a.className+' ghost';g.removeAttribute('href');
 g.style.cssText='left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;height:'+r.height+'px;min-height:0;grid-column:auto';
 ov.appendChild(g);
 var t=document.createElement('h2');t.className='stitle';t.textContent=h.textContent;
 var hr=h.getBoundingClientRect();t.style.left=hr.left+'px';t.style.top=hr.top+'px';
 ov.appendChild(t);
 var bar=document.createElement('div');bar.className='sbar';bar.innerHTML='<i></i>';
 var ld=document.createElement('div');ld.className='sload';ld.textContent='Loading...';
 ov.appendChild(bar);ov.appendChild(ld);
 document.body.appendChild(ov);
 var w=t.offsetWidth,th=t.offsetHeight,sc=Math.min(Math.min(vw*.84,560)/w,2.4);if(sc<1.15)sc=1.15;
 var tx=(vw-w*sc)/2-hr.left,ty=vh/2-th*sc/2-24-hr.top;
 try{sessionStorage.setItem('splash',JSON.stringify({bg:cs.backgroundColor,fg:cs.color,t:h.textContent,fs:parseFloat(getComputedStyle(h).fontSize)*sc}))}catch(_){}
 bar.style.top=(vh/2+th*sc/2+10)+'px';ld.style.top=(vh/2+th*sc/2+44)+'px';
 void ov.offsetWidth;
 requestAnimationFrame(function(){ov.classList.add('go');t.style.transform='translate('+tx+'px,'+ty+'px) scale('+sc+')'});
 var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
 setTimeout(function(){location.href=a.href},reduce?50:1800);
}
document.getElementById('subjects').addEventListener('click',function(e){
 var a=e.target.closest('a.sj');
 if(!a||e.metaKey||e.ctrlKey||e.shiftKey||e.button)return;
 e.preventDefault();go(a);
});
addEventListener('pageshow',function(e){if(e.persisted){busy=false;var o=document.querySelector('.splash');if(o)o.remove()}});
})();
</script>
</body></html>
