<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin · BSIT 1-2 Class Website</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<header class="top"><div class="top-in">
<a class="brand" href="admin.html"><svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><rect width="16" height="16" fill="#2F5BEA"/><g fill="#fff"><rect x="3" y="7" width="10" height="5"/><rect x="2" y="8" width="12" height="3"/><rect x="5" y="5" width="6" height="3"/><rect x="7" y="4" width="3" height="2"/></g><rect x="6" y="8" width="1" height="2" fill="#14213D"/><rect x="9" y="8" width="1" height="2" fill="#14213D"/></svg><span>BSIT 1-2 Admin</span></a>
<a class="bs sm" href="index.html">View site</a>
<button class="bs sm" id="out" type="button" hidden>Sign out</button>
</div></header>
<main>
<section id="cfg" class="box narrow" hidden>
<h1 class="pg">Not connected yet</h1>
<p class="mut">Open <b>js/config.js</b> and paste your Supabase Project URL and publishable key, then reload this page.</p>
</section>

<section id="login" class="box narrow" hidden>
<p class="eyebrow">Officers only</p><h1 class="pg">Admin login</h1>
<form id="lf" novalidate>
<div class="fld"><label for="em">Email</label><input id="em" type="email" autocomplete="username" required></div>
<div class="fld"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
<button class="bp" type="submit" id="lb">Log in</button>
<p class="mut sm-t" style="margin:14px 0 10px;text-align:center">or</p>
<button class="bs" type="button" id="gb" style="width:100%;justify-content:center">Continue with Google</button>
<p class="err" id="lmsg" role="alert"></p>
</form>
</section>

<section id="dash" hidden>
<p class="eyebrow">Admin</p><h1 class="pg">Manage content</h1>
<p class="mut">Changes show up on the public site right away.</p>
<div class="chips" id="tabs"></div>
<div class="grid" id="pane"></div>
</section>
</main>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/supa.js"></script>
<script src="js/data.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
